name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  calculate-and-send:
    # Paper Radar users run recommendations inside Zotero.
    if: github.repository != 'kongyan66/zotero-paper-radar' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
          prune-cache: false

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: embedding-models-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            embedding-models-${{ runner.os }}-

      - name: Cache interest profiles
        uses: actions/cache@v4
        with:
          path: .cache/zotero_arxiv_daily
          key: interest-profiles-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            interest-profiles-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
            interest-profiles-${{ runner.os }}-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          PROFILE_DEBUG_ONLY: ${{ vars.PROFILE_DEBUG_ONLY || '0' }}
          ARXIV_QUERY: ${{ vars.ARXIV_QUERY || secrets.ARXIV_QUERY || 'cs.CV+cs.CL' }}
          ARXIV_BATCH_SIZE: ${{ vars.ARXIV_BATCH_SIZE || secrets.ARXIV_BATCH_SIZE || '5' }}
          ARXIV_RETRY_ATTEMPTS: ${{ vars.ARXIV_RETRY_ATTEMPTS || secrets.ARXIV_RETRY_ATTEMPTS || '4' }}
          ARXIV_RETRY_DELAY_SECONDS: ${{ vars.ARXIV_RETRY_DELAY_SECONDS || secrets.ARXIV_RETRY_DELAY_SECONDS || '45' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || vars.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '465' }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ vars.MAX_PAPER_NUM || secrets.MAX_PAPER_NUM || '5' }}
          USE_LLM_API: ${{ vars.USE_LLM_API || secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ vars.MODEL_NAME || secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          INTEREST_PROFILE_CACHE: ${{ vars.INTEREST_PROFILE_CACHE || '1' }}
          INTEREST_PROFILE_MAX: ${{ vars.INTEREST_PROFILE_MAX || '10' }}
          INTEREST_PROFILE_REPRESENTATIVES: ${{ vars.INTEREST_PROFILE_REPRESENTATIVES || '3' }}
          INTEREST_PROFILE_CLUSTER_THRESHOLD: ${{ vars.INTEREST_PROFILE_CLUSTER_THRESHOLD || '0.72' }}
          INTEREST_PROFILE_MAX_MEMBERS: ${{ vars.INTEREST_PROFILE_MAX_MEMBERS || '45' }}
          INTEREST_PROFILE_DISPLAY_MIN_MEMBERS: ${{ vars.INTEREST_PROFILE_DISPLAY_MIN_MEMBERS || '2' }}
          INTEREST_PROFILE_SCORING_MIN_MEMBERS: ${{ vars.INTEREST_PROFILE_SCORING_MIN_MEMBERS || '2' }}
          INTEREST_PROFILE_DIVERSITY_PENALTY: ${{ vars.INTEREST_PROFILE_DIVERSITY_PENALTY || '0.35' }}
          RECENT_INTEREST_DAYS: ${{ vars.RECENT_INTEREST_DAYS || '90' }}
          RECENT_INTEREST_WEIGHT: ${{ vars.RECENT_INTEREST_WEIGHT || '0.6' }}
          LONG_TERM_INTEREST_WEIGHT: ${{ vars.LONG_TERM_INTEREST_WEIGHT || '0.4' }}
          UV_NO_PROGRESS: 1
        run: |
          uv sync --no-dev
          uv run --no-sync main.py
